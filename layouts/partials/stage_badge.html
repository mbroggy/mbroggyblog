{{- $stage := .Params.stage -}}
{{- if $stage -}}
<span class="stage-badge stage-{{ $stage }}">
  {{- if eq $stage "seed" -}}
  <svg class="stage-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <ellipse cx="12" cy="12.5" rx="6.5" ry="8.5" />
    <path d="M12 5c2.2 2.4 3.3 4.9 3.3 7.6 0 2.9-1.3 5.2-3.3 6.8" />
  </svg>
  <span class="stage-label">Seed</span>
  {{- else if eq $stage "tree" -}}
  <svg class="stage-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="9" r="6.5" />
    <rect x="10.5" y="13" width="3" height="8" rx="0.8" />
  </svg>
  <span class="stage-label">Tree</span>
  {{- else if eq $stage "fruit" -}}
  <svg class="stage-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="12.5" r="6.5" />
    <path d="M12 4c2 0 3.5 1 4.2 2.6" />
    <path d="M12 5.5c-1.4-1.8-2.8-2.3-4.6-2.3" />
  </svg>
  <span class="stage-label">Fruit</span>
  {{- else -}}
  <span class="stage-label">{{ $stage }}</span>
  {{- end -}}
</span>
{{- end -}}
