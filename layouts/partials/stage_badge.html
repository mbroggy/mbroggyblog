{{- $stage := .Params.stage -}}
{{- if $stage -}}
<span class="stage-badge stage-{{ $stage }}">
  {{- if eq $stage "seed" -}}
  <i class="fa-solid fa-seedling stage-icon" aria-hidden="true"></i>
  <span class="stage-label">Seed</span>
  {{- else if eq $stage "tree" -}}
  <i class="fa-solid fa-tree stage-icon" aria-hidden="true"></i>
  <span class="stage-label">Tree</span>
  {{- else if eq $stage "fruit" -}}
  <i class="fa-solid fa-apple-whole stage-icon" aria-hidden="true"></i>
  <span class="stage-label">Fruit</span>
  {{- else -}}
  <span class="stage-label">{{ $stage }}</span>
  {{- end -}}
</span>
{{- end -}}
