baseURL: "https://xooyooz.xyz"
languageCode: en-us
title: ~mbroggy
theme: PaperMod

params:
  mainSections:
    - notes

  comments: false
  # Set the number of posts per page
  paginate: 20

  homeInfoParams:
    Title: 'Encumbered by the vulgar exigencies of objective truth'
    Content: 'This is my blog for projects and ramblings, whether modernly geeky or medievally nerdy.'

  socialIcons:
    - name: Mastodon
      url: "https://medievalist.masto.host/deck/@maeleoin"
    - name: kofi
      url: "http://ko-fi.com/mbroggy"
    - name: linkedin
      url: "http://linkedin.com/in/mbroggy"
    - name: Facebook
      url: "https://m.me/mbroggy"    
    - name: discord
      url: "https://discord.com/users/552299981248135168"
    - name: GitHub
      url: "http://github.com/mbroggy"
    - name: email
      url: "mailto:mbroggy@gmail.com"
    - name: RSS
      url: "https://xooyooz.xyz/index.xml"

  ShowBreadCrumbs: true
  TocOpen: true
  ShowShareButtons: true
  ShareButtons: ["facebook"]
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  disableSpecial1stPost: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  enableGitInfo: true
  ShowToc: true
  TocOpen: true
  ShowAllPagesInArchive: true

  favicon: /favicon.ico

  markup:
    goldmark:
      renderer:
        unsafe: true
  
  env: production

taxonomies:
  tag: tags
  topic: topics
  stage: stages


outputs:
  home:
    - HTML
    - RSS
    - JSON 

cover:
  linkFullImages: true

permalinks:
  notes: "/posts/:slug/"
menu:
  main:
    - identifier: Blog
      name: Blog
      url: /categories/blog/
      weight: 1
    - identifier: Search
      name: Search
      url: search
      weight: 1
    - identifier: about
      name: About
      url: /about/
      weight: 2
    - identifier: categories
      name: Categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20    
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 30
