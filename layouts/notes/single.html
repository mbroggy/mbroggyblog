{{ define "main" }}
<article class="post-single">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.stage }}
    <div class="post-meta">
      {{ partial "stage_badge.html" $ }}
    </div>
    {{ end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ partial "backlinks.html" . }}
</article>
{{ end }}
