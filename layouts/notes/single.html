{{ define "main" }}
<article class="post-single">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ with .Params.stage }}<div class="post-meta">Stage: {{ . }}</div>{{ end }}
  </header>

  <div class="post-content">
    {{ .Content }}
  </div>

  {{ partial "backlinks.html" . }}
</article>
{{ end }}
